<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Cara</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- START OVERLAY (obligatorio en iOS para desbloquear audio y cámara) -->
  <div id="start">
    <h1>Cara</h1>
    <p>Tocá “Iniciar” para habilitar audio, micrófono y cámara.</p>
    <button id="startBtn">INICIAR</button>
  </div>

  <!-- VIDEO DE FONDO -->
  <div id="video-layer">
    <video id="v1" class="v active" playsinline muted loop preload="auto"></video>
    <video id="v2" class="v" playsinline muted loop preload="auto"></video>
  </div>

  <!-- VIDEO OCULTO DE CÁMARA (NO SE MUESTRA) -->
  <video id="cam" playsinline autoplay muted style="display:none"></video>

  <!-- UI -->
  <div id="ui-layer">
    <div id="topbar">
      <div id="status"><span id="dot">●</span><span id="statusText">Cara está contigo</span></div>
      <div class="row">
        <button id="menuBtn" class="btn" aria-expanded="false">≡</button>
      </div>
    </div>

    <!-- Backdrop -->
    <div id="menuBackdrop"></div>

    <!-- Side menu -->
    <div id="sideMenu">
      <h2>Ajustes</h2>

      <div class="setting">
        <label>Modo</label>
        <div class="row">
          <button id="modeNormal" class="chip active" type="button">Normal</button>
          <button id="modeAdult" class="chip" type="button">Adulto +18</button>
        </div>
      </div>

      <div class="setting">
        <label>Iniciativa</label>
        <div class="row">
          <span class="mini">Cara habla sola</span>
          <button id="autoToggle" class="chip active" type="button">ON</button>
        </div>
      </div>

      <div class="setting">
        <label>Velocidad de voz</label>
        <input type="range" min="0.75" max="1.2" step="0.01" id="voiceRate" value="0.95">
        <div class="mini"><span id="voiceRateVal">0.95</span></div>
      </div>

      <div class="setting">
        <label>Intensidad visual</label>
        <input type="range" min="0" max="1" step="0.01" id="intensity" value="0.45">
        <div class="mini"><span id="intensityVal">0.45</span></div>
      </div>

      <div class="setting">
        <label>Zoom video</label>
        <input type="range" min="0.95" max="1.3" step="0.01" id="zoom" value="1.00">
        <div class="mini"><span id="zoomVal">1.00</span></div>
      </div>

      <div class="setting" style="border-bottom:none;">
        <button id="forceNext" class="btn wide" type="button">Cambiar video</button>
      </div>
    </div>

    <!-- BOTTOM INPUT -->
    <div id="bottom">
      <div id="inputWrap">
        <button id="micBtn" title="Hablar">🎤</button>
        <input id="msg" placeholder="Decile algo a Cara..." autocomplete="off" />
        <button id="send" type="button">Enviar</button>
      </div>
    </div>
  </div>

  <!-- MediaPipe Face Detection (on-device) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

  <script src="assets/js/app.js"></script>
</body>
</html>
