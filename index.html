<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Cara</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- START OVERLAY -->
  <div id="start">
    <h1>Cara</h1>
    <p>Tocá “Iniciar” para habilitar audio y que Cara pueda hablar.</p>
    <button id="startBtn">INICIAR</button>
  </div>

  <!-- VIDEO -->
  <div id="video-layer">
    <video id="v1" class="v active" playsinline muted loop preload="auto"></video>
    <video id="v2" class="v" playsinline muted loop preload="auto"></video>
  </div>

  <!-- UI -->
  <div id="ui-layer">

    <div id="topbar">
      <div id="status"><span id="dot">●</span><span id="statusText">Cara está contigo</span></div>
    </div>

    <div id="bottom">
      <div id="inputWrap">
        <input id="msg" placeholder="Decile algo a Cara..." autocomplete="off" />
        <button id="send" type="button">Enviar</button>
      </div>
    </div>

  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
